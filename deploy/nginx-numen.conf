# Numen voice-agent platform (docker compose project "numen", repo ~/numen, deploy/).
# Web app (Next.js, basePath /numen) on loopback 3001. The upstream receives the full /numen/... path.
location = /numen {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /numen/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}

# Twilio voice webhook and media stream (FastAPI on loopback 7860). Only these two paths are
# public here (plus the hold loop and transfer callback); the admin API is reached through the web app's /numen/api proxy.
location = /numen-voice/incoming {
    proxy_pass http://127.0.0.1:7860/incoming;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}
# The hold loop: queued callers come back here every few seconds while they wait for a free slot.
location = /numen-voice/incoming/hold {
    proxy_pass http://127.0.0.1:7860/incoming/hold$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}
# Twilio reports how a transfer ended (busy, no answer...) so the caller hears a closing message.
location = /numen-voice/transfer/done {
    proxy_pass http://127.0.0.1:7860/transfer/done$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}
location = /numen-voice/ws {
    proxy_pass http://127.0.0.1:7860/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
