name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same Postgres and Python as production (deploy/docker-compose.yml, Dockerfile.backend).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: numen
          POSTGRES_PASSWORD: numen
          POSTGRES_DB: numen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U numen" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://numen:numen@localhost:5432/numen
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (from uv.lock)
        run: uv sync --frozen
      - name: Import check
        run: uv run python -c "import server, numen.bot, numen.api, numen.api_users"
      - name: Tests
        run: uv run pytest -q

  web:
    name: Web app (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build (as deployed, under /numen)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /numen
