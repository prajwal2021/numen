[project]
name = "numen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "pipecat-ai[elevenlabs,openai,runner,silero,websocket]>=1.16.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0",
    "twilio>=9.13.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
